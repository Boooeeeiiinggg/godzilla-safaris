<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godzilla Safaris - Travel with the Best</title>
    
    <!-- Google Fonts for Custom Themes -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&family=Russo+One&family=Uncial+Antiqua&family=Cinzel+Decorative:wght@700;900&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    
    <style>
        /* ============================================================
           GLOBAL RESET & BASE
        ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ============================================================
           HERO SECTION
        ============================================================ */
        .hero {
            padding: 50px 20px 40px;
            text-align: center;
            border-bottom: 2px solid #1a1a1a;
            background: #0a0a0a;
        }

        .hero h1 {
            font-size: 4rem;
            letter-spacing: 6px;
            font-family: 'Oswald', sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            color: #ffd700;
            text-shadow: 3px 3px 0 #cc0000;
            transform: skew(-5deg);
        }

        .hero h1 span {
            color: #39ff14;
            text-shadow: 3px 3px 0 #006600;
        }

        .hero .tagline {
            font-size: 1.8rem;
            font-family: 'Playfair Display', serif;
            font-style: italic;
            color: #ffd700;
            margin-top: 5px;
        }

        .hero .sub-tagline {
            font-size: 1.2rem;
            font-family: 'Russo One', sans-serif;
            color: #ff6b6b;
            margin-top: 8px;
            letter-spacing: 4px;
        }

        .hero .location-badge-hero {
            display: inline-block;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            padding: 8px 25px;
            border-radius: 50px;
            font-family: 'Russo One', sans-serif;
            color: #aaa;
            font-size: 0.95rem;
            letter-spacing: 2px;
        }

        /* ============================================================
           FLEET GRID
        ============================================================ */
        .fleet {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 40px;
        }

        /* ============================================================
           VAN CARDS
        ============================================================ */
        .van-card {
            background: #111;
            border-radius: 20px;
            padding: 35px 25px 30px;
            text-align: center;
            transition: all 0.4s ease;
            cursor: pointer;
            border: 2px solid #222;
        }

        .van-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .van-card .icon {
            font-size: 4.5rem;
            display: inline-block;
            margin-bottom: 5px;
        }

        .van-card h2 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            margin: 5px 0;
        }

        .van-card .features {
            display: flex;
            justify-content: center;
            gap: 18px;
            font-size: 0.85rem;
            color: #bbb;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .van-card .features i {
            margin-right: 5px;
        }

        .btn-view {
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #000;
            background: #39ff14;
        }

        .btn-view:hover {
            transform: scale(1.05);
        }

        /* ---- GODZILLA CARD (Blue) ---- */
        .van-card.godzilla {
            border-color: #1a8cff;
        }
        .van-card.godzilla:hover {
            border-color: #1a8cff;
            box-shadow: 0 0 30px rgba(26, 140, 255, 0.15);
        }
        .van-card.godzilla .features i { color: #1a8cff; }
        .van-card.godzilla .btn-view {
            background: #1a8cff;
            color: #fff;
        }
        .van-card.godzilla .btn-view:hover {
            background: #1a8cff;
            box-shadow: 0 0 20px rgba(26, 140, 255, 0.3);
        }
        /* Godzilla Font - Money Heist Style */
        .van-card.godzilla h2 {
            font-family: 'Oswald', sans-serif;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 3px 3px 0 #cc0000;
            letter-spacing: 6px;
            transform: skew(-5deg);
        }

        /* ---- RAGNAR CARD (Black & White with Red accents) ---- */
        .van-card.ragnar {
            border-color: #555;
        }
        .van-card.ragnar:hover {
            border-color: #ff4444;
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.15);
        }
        .van-card.ragnar .features i { color: #ff4444; }
        .van-card.ragnar .btn-view {
            background: #ff4444;
            color: #fff;
        }
        .van-card.ragnar .btn-view:hover {
            background: #cc0000;
            box-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }
        /* Ragnar Font - Viking Bold */
        .van-card.ragnar h2 {
            font-family: 'Uncial Antiqua', serif;
            font-weight: 700;
            color: #ff4444;
            text-shadow: 2px 2px 0 #000, 4px 4px 0 #333;
            letter-spacing: 6px;
        }

        /* ---- GOTHIC CARD (Jungle Green) ---- */
        .van-card.gothic {
            border-color: #2d5a3d;
        }
        .van-card.gothic:hover {
            border-color: #50c878;
            box-shadow: 0 0 30px rgba(80, 200, 120, 0.15);
        }
        .van-card.gothic .features i { color: #50c878; }
        .van-card.gothic .btn-view {
            background: #50c878;
            color: #000;
        }
        .van-card.gothic .btn-view:hover {
            background: #3da861;
            box-shadow: 0 0 20px rgba(80, 200, 120, 0.3);
        }
        /* Gothic Font - Glossy Horror */
        .van-card.gothic h2 {
            font-family: 'Cinzel Decorative', serif;
            font-weight: 900;
            background: linear-gradient(135deg, #50c878, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
        }

        /* ============================================================
           VAN DETAIL PAGE
        ============================================================ */
        #vanDetail {
            display: none;
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
            animation: fadeSlideUp 0.5s ease;
        }

        @keyframes fadeSlideUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .van-detail-card {
            background: #111;
            border-radius: 25px;
            padding: 40px 35px;
            border: 2px solid #333;
        }

        .van-detail-card .van-header {
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
            border-bottom: 2px solid #1a1a1a;
            padding-bottom: 20px;
            margin-bottom: 20px;
        }

        .van-detail-card .van-header .icon {
            font-size: 4rem;
        }

        .van-detail-card .van-header h2 {
            font-size: 3.2rem;
            letter-spacing: 4px;
        }

        /* Detail page font overrides */
        .van-detail-card.godzilla-detail .van-header h2 {
            font-family: 'Oswald', sans-serif;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 3px 3px 0 #cc0000;
            transform: skew(-5deg);
        }

        .van-detail-card.ragnar-detail .van-header h2 {
            font-family: 'Uncial Antiqua', serif;
            color: #ff4444;
            text-shadow: 2px 2px 0 #000, 4px 4px 0 #333;
        }

        .van-detail-card.gothic-detail .van-header h2 {
            font-family: 'Cinzel Decorative', serif;
            background: linear-gradient(135deg, #50c878, #9b59b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .van-detail-card .van-header .sub {
            color: #666;
            font-size: 1rem;
        }

        .image-gallery {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin: 20px 0;
        }

        .image-gallery .image-box {
            background: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #222;
            transition: all 0.3s ease;
            position: relative;
        }

        .image-gallery .image-box:hover {
            border-color: #39ff14;
            transform: scale(1.02);
        }

        .image-gallery .image-box img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
        }

        .image-gallery .image-box .label {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            padding: 5px 20px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #39ff14;
            border: 1px solid #39ff14;
            letter-spacing: 1px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
        }

        .info-grid .info-item {
            background: #1a1a1a;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            border: 1px solid #222;
            transition: all 0.3s ease;
        }

        .info-grid .info-item:hover {
            border-color: #39ff14;
        }

        .info-grid .info-item i {
            font-size: 1.8rem;
            display: block;
            margin-bottom: 8px;
        }

        .info-grid .info-item span {
            font-size: 0.95rem;
            color: #ccc;
        }

        .location-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: #aaa;
            padding: 8px 25px;
            border-radius: 50px;
            display: inline-block;
            margin: 10px 0;
            font-weight: 600;
            font-family: 'Russo One', sans-serif;
            letter-spacing: 2px;
        }

        .social-links {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .social-links a {
            color: #fff;
            background: #1a1a1a;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid #333;
        }

        .social-links a:hover {
            background: #E4405F;
            color: #fff;
            transform: scale(1.1);
            border-color: #E4405F;
        }

        .contact-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .contact-row a {
            background: #1a1a1a;
            padding: 14px 30px;
            border-radius: 50px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid #333;
            letter-spacing: 1px;
        }

        .contact-row a i { margin-right: 12px; }
        .contact-row a:hover { border-color: #39ff14; transform: scale(1.05); }
        .contact-row .whatsapp-link {
            background: #25D366;
            border-color: #25D366;
            color: #fff;
        }
        .contact-row .whatsapp-link:hover {
            background: #128C7E;
            border-color: #128C7E;
        }

        .booking-section {
            margin-top: 30px;
            border-top: 2px solid #1a1a1a;
            padding-top: 25px;
        }

        .booking-section h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #39ff14;
            font-family: 'Russo One', sans-serif;
            letter-spacing: 2px;
        }

        .booking-form input,
        .booking-form textarea,
        .booking-form select {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border-radius: 14px;
            border: 1px solid #222;
            background: #1a1a1a;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .booking-form input:focus,
        .booking-form textarea:focus,
        .booking-form select:focus {
            outline: none;
            border-color: #39ff14;
            background: #0f0f0f;
        }

        .booking-form textarea {
            height: 70px;
            resize: vertical;
        }

        .booking-form .submit-wa {
            background: #25D366;
            color: #fff;
            font-weight: 700;
            padding: 18px;
            border: none;
            border-radius: 50px;
            width: 100%;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            letter-spacing: 2px;
        }

        .booking-form .submit-wa:hover {
            background: #128C7E;
            transform: scale(1.02);
        }

        .booking-form .submit-wa i { font-size: 1.6rem; }

        .back-btn {
            background: transparent;
            border: 1px solid #333;
            color: #aaa;
            padding: 12px 35px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            width: 100%;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 2px;
        }

        .back-btn:hover {
            border-color: #39ff14;
            color: #fff;
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: #444;
            border-top: 1px solid #1a1a1a;
            margin-top: 40px;
            font-family: 'Russo One', sans-serif;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        /* ============================================================
           RESPONSIVE
        ============================================================ */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.8rem; letter-spacing: 4px; }
            .hero .tagline { font-size: 1.4rem; }
            .hero .sub-tagline { font-size: 1rem; letter-spacing: 3px; }
            .van-card h2 { font-size: 2rem; }
            .van-detail-card .van-header h2 { font-size: 2.5rem; }
            .image-gallery { grid-template-columns: 1fr; }
            .image-gallery .image-box img { height: 200px; }
            .info-grid { grid-template-columns: 1fr; }
            .van-detail-card .van-header { flex-direction: column; text-align: center; }
            .van-detail-card { padding: 25px 18px; }
            .fleet { grid-template-columns: 1fr; gap: 25px; }
        }

        @media (max-width: 480px) {
            .hero h1 { font-size: 2rem; letter-spacing: 2px; }
            .hero .tagline { font-size: 1.1rem; }
            .van-card { padding: 25px 15px; }
            .van-card h2 { font-size: 1.6rem; }
            .contact-row a { padding: 10px 18px; font-size: 0.9rem; }
            .social-links a { width: 50px; height: 50px; font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    HERO SECTION - STARS REMOVED
    ============================================================ -->
    <div class="hero" id="homeHero">
        <h1>🦎 <span>GODZILLA</span> SAFARIS</h1>
        <div class="tagline">Travel with the Best</div>
        <div class="sub-tagline">⬡ SHARK NATION ⬡</div>
        <div class="location-badge-hero">
            <i class="fas fa-map-pin"></i> Based in Nairobi, Kenya
        </div>
    </div>

    <!-- ============================================================
    FLEET GRID
    ============================================================ -->
    <div class="fleet" id="fleetGrid">
        <!-- GODZILLA -->
        <div class="van-card godzilla" onclick="showVan('Godzilla')">
            <div class="icon">🦎</div>
            <h2>GODZILLA</h2>
            <div class="features">
                <span><i class="fas fa-users"></i> 14 Seater</span>
                <span><i class="fas fa-music"></i> Sound System</span>
                <span><i class="fas fa-lightbulb"></i> Ambient Light</span>
            </div>
            <button class="btn-view"><i class="fas fa-eye"></i> View & Book</button>
        </div>

        <!-- RAGNAR -->
        <div class="van-card ragnar" onclick="showVan('Ragnar')">
            <div class="icon">⚔️</div>
            <h2>RAGNAR</h2>
            <div class="features">
                <span><i class="fas fa-users"></i> 10 Seater</span>
                <span><i class="fas fa-music"></i> Sound System</span>
                <span><i class="fas fa-lightbulb"></i> Ambient Light</span>
            </div>
            <button class="btn-view"><i class="fas fa-eye"></i> View & Book</button>
        </div>

        <!-- GOTHIC -->
        <div class="van-card gothic" onclick="showVan('Gothic')">
            <div class="icon">🖤</div>
            <h2>GOTHIC</h2>
            <div class="features">
                <span><i class="fas fa-users"></i> 14 Seater</span>
                <span><i class="fas fa-music"></i> Sound System</span>
                <span><i class="fas fa-lightbulb"></i> Ambient Light</span>
            </div>
            <button class="btn-view"><i class="fas fa-eye"></i> View & Book</button>
        </div>
    </div>

    <!-- ============================================================
    VAN DETAIL PAGE
    ============================================================ -->
    <div id="vanDetail">
        <div class="van-detail-card" id="vanDetailCard">
            <!-- Dynamic content -->
        </div>
    </div>

    <!-- ============================================================
    FOOTER
    ============================================================ -->
    <div class="footer" id="mainFooter">
        <p>© 2026 Godzilla Safaris — Shark Nation <i class="fas fa-shark" style="color:#39ff14;"></i></p>
    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        //  VAN DATA
        // ============================================================
        const vanData = {
            'Godzilla': {
                icon: '🦎',
                color: '#1a8cff',
                colorName: 'Blue',
                phone: '254773209863',
                seats: '14 Seater',
                instagram: 'https://www.instagram.com/godzilaa001/',
                imageFront: 'images/godzilla-face.jpeg',
                imageBack: 'images/godzilla-back.jpeg',
                detailClass: 'godzilla-detail'
            },
            'Ragnar': {
                icon: '⚔️',
                color: '#ff4444',
                colorName: 'Black & White',
                phone: '254798394613',
                seats: '10 Seater',
                instagram: 'https://www.instagram.com/ragnar.mk001/',
                imageFront: 'images/ragnar-face.jpeg',
                imageBack: 'images/ragnar-back.jpeg',
                detailClass: 'ragnar-detail'
            },
            'Gothic': {
                icon: '🖤',
                color: '#50c878',
                colorName: 'Emerald Green',
                phone: '254745717972',
                seats: '14 Seater',
                instagram: 'https://www.instagram.com/godz.ill.a_2.0/',
                imageFront: 'images/gothic-face.jpeg',
                imageBack: 'images/gothic-back.jpeg',
                detailClass: 'gothic-detail'
            }
        };

        let currentVanName = '';

        // ============================================================
        //  SHOW VAN DETAIL
        // ============================================================
        function showVan(name) {
            currentVanName = name;
            document.getElementById('fleetGrid').style.display = 'none';
            document.getElementById('vanDetail').style.display = 'block';
            document.getElementById('homeHero').style.display = 'none';

            const data = vanData[name];
            if (!data) return;

            const card = document.getElementById('vanDetailCard');
            card.style.borderColor = data.color;
            card.className = 'van-detail-card ' + data.detailClass;

            card.innerHTML = `
                <div class="van-header">
                    <div class="icon">${data.icon}</div>
                    <div>
                        <h2>${name.toUpperCase()}</h2>
                    </div>
                </div>

                <div class="location-badge">
                    <i class="fas fa-map-pin"></i> Based in Nairobi, Kenya
                </div>

                <div class="image-gallery">
                    <div class="image-box">
                        <img src="${data.imageFront}" alt="${name} Front" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:260px;background:#1a1a1a;color:#555;\\'><i class=\\'fas fa-image\\' style=\\'font-size:2rem;margin-right:10px;\\'></i> Add ${name} Front</div>'">
                        <div class="label">👀 Front View</div>
                    </div>
                    <div class="image-box">
                        <img src="${data.imageBack}" alt="${name} Back" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:260px;background:#1a1a1a;color:#555;\\'><i class=\\'fas fa-image\\' style=\\'font-size:2rem;margin-right:10px;\\'></i> Add ${name} Back</div>'">
                        <div class="label">🔙 Back View</div>
                    </div>
                </div>

                <div class="info-grid">
                    <div class="info-item">
                        <i class="fas fa-users" style="color:${data.color};"></i>
                        <span>${data.seats}</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-palette" style="color:${data.color};"></i>
                        <span>Color: ${data.colorName}</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-music" style="color:${data.color};"></i>
                        <span>High Quality Sound System</span>
                    </div>
                    <div class="info-item">
                        <i class="fas fa-lightbulb" style="color:${data.color};"></i>
                        <span>Ambient Lighting</span>
                    </div>
                </div>

                <div class="social-links">
                    <a href="${data.instagram}" target="_blank"><i class="fab fa-instagram"></i></a>
                </div>

                <div class="contact-row">
                    <a href="tel:+${data.phone}"><i class="fas fa-phone-alt"></i> Call</a>
                    <a href="https://wa.me/${data.phone}" target="_blank" class="whatsapp-link">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </a>
                </div>

                <div class="booking-section">
                    <h3><i class="fas fa-calendar-check" style="color:${data.color};"></i> Book This Van</h3>
                    <p style="color:#aaa; margin-bottom:15px; font-size:0.95rem;">
                        Fill in your details and we'll confirm via WhatsApp within 10 minutes.
                    </p>

                    <form class="booking-form" id="waForm">
                        <input type="text" id="waName" placeholder="Your Full Name" required />
                        <input type="tel" id="waPhone" placeholder="Phone Number (e.g., 0712345678)" required />
                        <input type="text" id="waPickup" placeholder="Pickup Location (e.g., Westlands, Nairobi)" required />
                        <input type="text" id="waDestination" placeholder="Destination (e.g., JKIA, Nairobi)" required />
                        <input type="datetime-local" id="waDateTime" required />
                        <textarea id="waExtra" placeholder="Any extra info (guests, luggage, special requests...)"></textarea>

                        <button type="submit" class="submit-wa">
                            <i class="fab fa-whatsapp"></i> Send Booking via WhatsApp
                        </button>
                    </form>
                    <p style="font-size:0.8rem; color:#555; margin-top:10px; text-align:center;">
                        <i class="fas fa-lock" style="color:${data.color};"></i> Your info is safe. We'll reply via WhatsApp.
                    </p>
                </div>

                <button class="back-btn" onclick="goHome()">
                    <i class="fas fa-arrow-left"></i> Back to Fleet
                </button>
            `;

            // WhatsApp form handler
            document.getElementById('waForm').addEventListener('submit', function(e) {
                e.preventDefault();

                const vanName = currentVanName.toUpperCase();
                const name = document.getElementById('waName').value.trim();
                const phone = document.getElementById('waPhone').value.trim();
                const pickup = document.getElementById('waPickup').value.trim();
                const destination = document.getElementById('waDestination').value.trim();
                const dateTime = document.getElementById('waDateTime').value;
                const extra = document.getElementById('waExtra').value.trim();

                const formattedDate = dateTime ? new Date(dateTime).toLocaleString('en-KE', {
                    timeZone: 'Africa/Nairobi',
                    dateStyle: 'full',
                    timeStyle: 'short'
                }) : 'Not specified';

                const message = 
                    'GODZILLA SAFARIS - Booking Request\n' +
                    'Van: ' + vanName + '\n' +
                    'Name: ' + name + '\n' +
                    'Phone: ' + phone + '\n' +
                    'Pickup: ' + pickup + '\n' +
                    'Destination: ' + destination + '\n' +
                    'Date/Time: ' + formattedDate + '\n' +
                    'Extra Info: ' + (extra || 'None') + '\n\n' +
                    'Based in Nairobi, Kenya';

                const encoded = encodeURIComponent(message);
                const waUrl = 'https://wa.me/' + data.phone + '?text=' + encoded;

                window.open(waUrl, '_blank');
                this.reset();
            });

            window.scrollTo(0, 0);
        }

        // ============================================================
        //  GO HOME
        // ============================================================
        function goHome() {
            document.getElementById('fleetGrid').style.display = 'grid';
            document.getElementById('vanDetail').style.display = 'none';
            document.getElementById('homeHero').style.display = 'block';
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
